[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-firewall"
version = "0.2.0"
description = "Panel checks what an AI agent says and what it does: an action firewall (MCP proxy, deterministic policy, consent, idempotency, signed receipts) and a support-bot guard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"          # SPDX; matches LICENSE
license-files = ["LICENSE"]
keywords = ["ai-agents", "mcp", "guardrails", "policy", "receipts", "llm-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "sqlglot==30.33.0",
  "cryptography>=46",
  "tenthlook-core>=0.1",
  "PyYAML>=6",
  "httpx>=0.28",
  "numpy>=1.26",            # the vendored policy graph uses it
]

[project.urls]
Homepage = "https://usepanel.dev"
Documentation = "https://usepanel.dev/how-it-works"
Repository = "https://github.com/NarenS31/panel-firewall"
Issues = "https://github.com/NarenS31/panel-firewall/issues"
Changelog = "https://github.com/NarenS31/panel-firewall/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
llm = ["openai>=1"]          # only for eval/run_llm_eval.py

[project.scripts]
usepanel = "panel_firewall.firewall.cli:main"

[tool.setuptools.packages.find]
include = ["panel_firewall*"]

[tool.setuptools.package-data]
panel_firewall = ["guard/static/*", "guard/data/*"]

[tool.ruff.lint]
# Style/strictness rules suppressed on purpose: the code fails closed with broad excepts (BLE001, S110), tests and
# scripts bind throwaway variables, and subprocess calls check results themselves. Real bugs (F, E9) stay enforced.
ignore = ["BLE001", "S110", "RUF059", "F841", "ISC004", "PLW1510", "PLW1509", "SIM115", "SIM102", "C408", "B023",
          "B018", "RUF015", "RUF012", "RUF034", "RUF046", "TRY004", "PERF102", "FURB192"]

[tool.ruff]
# guard/v6.py is hash-pinned (tests/test_v61.py::test_v6_is_still_frozen); never reformat it.
extend-exclude = ["panel_firewall/guard/v6.py"]
